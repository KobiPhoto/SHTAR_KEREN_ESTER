<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>גמ"ח קרן אסתר - טופס בקשה</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #f1f5f9; }
        .font-serif-title { font-family: 'Frank Ruhl Libre', serif; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .input-group:focus-within label { color: #1e3a8a; }
        .input-group:focus-within input, .input-group:focus-within select { border-color: #1e3a8a; box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }
        
        .loader-dots div { animation-timing-function: cubic-bezier(0, 1, 1, 0); }
        .loader-dots div:nth-child(1) { left: 8px; animation: loader-dots1 0.6s infinite; }
        .loader-dots div:nth-child(2) { left: 8px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(3) { left: 32px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(4) { left: 56px; animation: loader-dots3 0.6s infinite; }
        @keyframes loader-dots1 { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes loader-dots3 { 0% { transform: scale(1); } 100% { transform: scale(0); } }
        @keyframes loader-dots2 { 0% { transform: translate(0, 0); } 100% { transform: translate(24px, 0); } }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- פונקציות עזר ---
        const getHebrewDate = () => {
            return new Date().toLocaleDateString('he-IL', {day:'numeric', month:'long', year:'numeric', calendar:'hebrew'});
        };

        const numToHebrew = (num) => {
            if (!num) return "";
            const n = parseInt(num);
            if (isNaN(n)) return "";
            const units = ["", "אלף", "אלפיים", "שלושת אלפים", "ארבעת אלפים", "חמשת אלפים", "ששת אלפים", "שבעת אלפים", "שמונת אלפים", "תשעת אלפים", "עשרת אלפים"];
            if (n >= 1000 && n <= 10000 && n % 1000 === 0) return units[n / 1000] + " שקלים";
            if (n === 500) return "חמש מאות שקלים";
            return ""; 
        };

        const ISRAELI_BANKS = [
            { code: '12', name: 'בנק הפועלים' }, { code: '10', name: 'בנק לאומי' }, { code: '11', name: 'בנק דיסקונט' },
            { code: '52', name: 'בנק פאג"י' }, { code: '20', name: 'בנק מזרחי טפחות' }, { code: '17', name: 'בנק מרכנתיל' },
            { code: '31', name: 'הבנק הבינלאומי' }, { code: '09', name: 'בנק הדואר' }, { code: '04', name: 'בנק יהב' },
            { code: '46', name: 'בנק מסד' }, { code: '14', name: 'בנק אוצר החייל' }
        ];

        const InputField = ({ label, type, name, value, onChange, onBlur, placeholder, required = true, error, className, children }) => (
            <div className={`input-group mb-4 ${className}`}>
                <label className="block text-gray-600 text-xs font-bold mb-1 tracking-wide">{label} {required && <span className="text-red-500">*</span>}</label>
                <input type={type} name={name} value={value} onChange={onChange} onBlur={onBlur} className={`w-full px-3 py-2 rounded border ${error ? 'border-red-500 bg-red-50' : 'border-gray-300 bg-white'} outline-none transition-all duration-200 text-gray-800 text-sm h-10`} placeholder={placeholder} required={required} />
                {error && <p className="text-red-500 text-xs mt-1 font-medium flex items-center"><span className="mr-1">⚠</span> {error}</p>}
                {children}
            </div>
        );

        const SelectField = ({ label, name, value, onChange, options, required = true }) => (
            <div className={`input-group mb-4`}>
                <label className="block text-gray-600 text-xs font-bold mb-1 tracking-wide">{label} {required && <span className="text-red-500">*</span>}</label>
                <select name={name} value={value} onChange={onChange} className="w-full px-3 py-2 rounded border border-gray-300 bg-white outline-none transition-all duration-200 text-gray-800 text-sm h-10" required={required}>
                    <option value="" disabled>בחר בנק...</option>
                    {options.map((opt, idx) => <option key={idx} value={`${opt.name} (${opt.code})`}>{opt.name} ({opt.code})</option>)}
                </select>
            </div>
        );

        const ProcessingOverlay = ({ text }) => (
            <div className="fixed inset-0 bg-gray-900 bg-opacity-75 flex flex-col items-center justify-center z-50">
                <div className="bg-white p-8 rounded-xl shadow-2xl flex flex-col items-center max-w-sm w-full">
                    <div className="loader-dots relative w-20 h-5 mb-4">
                        <div className="absolute top-0 w-3 h-3 rounded-full bg-blue-600"></div><div className="absolute top-0 w-3 h-3 rounded-full bg-blue-600"></div><div className="absolute top-0 w-3 h-3 rounded-full bg-blue-600"></div><div className="absolute top-0 w-3 h-3 rounded-full bg-blue-600"></div>
                    </div>
                    <h3 className="text-xl font-bold text-gray-800 mb-2">אנא המתן...</h3>
                    <p className="text-blue-600 font-medium animate-pulse">{text}</p>
                </div>
            </div>
        );

        // --- Main App ---
        const App = () => {
            // *** הדבק כאן את הכתובת החדשה של ה-APP SCRIPT ***
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNAlwhFVlUnyYpPhjUaw_CWlvigtRJOEmM7qyFNHvXo0eksT9diQkcJsfUL8wogKGB-g/exec"; 

            const [step, setStep] = useState(1);
            const [submitting, setSubmitting] = useState(false);
            const [loadingText, setLoadingText] = useState("שומר נתונים...");
            const [errors, setErrors] = useState({ idNumber: '', phone: '', bankAccount: '' });
            const [forceBankSubmit, setForceBankSubmit] = useState(false);
            
            // נדרים פלוס states
            const [showNedarim, setShowNedarim] = useState(false);
            const [isNedarimDone, setIsNedarimDone] = useState(false);

            const [formData, setFormData] = useState({
                amount: '', amountWords: '', 
                monthlyPayment: '', paymentsCount: '', startDate: '', 
                firstName: '', lastName: '', idNumber: '', 
                street: '', houseNum: '', city: 'חיפה',
                phone: '', additionalPhone: '', email: '', 
                bankName: '', bankBranch: '', bankAccount: ''
            });

            const guarantorsCount = (!formData.amount) ? 0 : (parseInt(formData.amount) <= 10000 ? 2 : 2 + Math.ceil((parseInt(formData.amount) - 10000) / 10000));

            // האזנה לאישור מנדרים פלוס
            useEffect(() => {
                const handleMessage = (event) => {
                    if (event.data && (event.data.Name === 'NedarimPlus' || event.data === 'TransactionSuccess')) {
                        setIsNedarimDone(true);
                        setShowNedarim(false);
                        alert("הוראת הקבע הוקמה בהצלחה!");
                    }
                };
                window.addEventListener("message", handleMessage);
                return () => window.removeEventListener("message", handleMessage);
            }, []);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => {
                    const newData = { ...prev, [name]: value };
                    if (name === 'amount') {
                        const words = numToHebrew(value);
                        if (words) newData.amountWords = words;
                    }
                    return newData;
                });
                if (errors[name]) setErrors({ ...errors, [name]: '' });
                if (name === 'bankName' || name === 'bankAccount') setForceBankSubmit(false);
            };

            const openNedarim = () => {
                if (!formData.monthlyPayment || !formData.firstName) {
                    alert("אנא מלא שם וסכום תשלום חודשי לפני הקמת ההו\"ק");
                    return;
                }
                setShowNedarim(true);
            };

            const handleSubmitForm = async (e) => {
                e.preventDefault();
                setSubmitting(true);
                
                const hebrewDate = getHebrewDate();
                const fullAddress = `${formData.street} ${formData.houseNum}, ${formData.city}`;
                const dataToSend = { ...formData, address: fullAddress, hebrewDate: hebrewDate };
                
                if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "PASTE_YOUR_URL_HERE") {
                    try {
                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: "POST",
                            mode: "no-cors",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(dataToSend)
                        });
                        setTimeout(() => { setSubmitting(false); setStep(2); }, 2500);
                    } catch (error) {
                        setStep(2); setSubmitting(false);
                    }
                } else {
                    alert("חסר קישור לשרת");
                    setSubmitting(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col items-center py-6 px-4">
                    {submitting && <ProcessingOverlay text={loadingText} />}
                    
                    <div className="text-center mb-6 w-full max-w-5xl">
                        <h1 className="text-3xl font-serif-title font-bold text-slate-800 tracking-tight">קרן אסתר</h1>
                        <p className="text-slate-500 font-medium text-sm">ע.ר. 580021475</p>
                    </div>

                    <div className="w-full max-w-6xl bg-white rounded shadow-2xl overflow-hidden border-t-4 border-slate-800 animate-fade-in">
                        <div className="p-8">
                            {step === 1 && (
                                <form onSubmit={handleSubmitForm}>
                                    
                                    {/* --- טופס פרטים --- */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        {/* עמודה 1 */}
                                        <div className="bg-slate-50 p-4 rounded border border-slate-100">
                                            <h3 className="text-xs font-bold text-slate-400 uppercase mb-4">פרטי אישיים</h3>
                                            <div className="grid grid-cols-2 gap-3">
                                                <InputField label="שם פרטי" name="firstName" value={formData.firstName} onChange={handleChange} placeholder="ישראל" type="text" className="col-span-1" />
                                                <InputField label="שם משפחה" name="lastName" value={formData.lastName} onChange={handleChange} placeholder="ישראלי" type="text" className="col-span-1" />
                                            </div>
                                            <InputField label="מספר זהות" name="idNumber" value={formData.idNumber} onChange={handleChange} placeholder="000000000" type="text" />
                                            <div className="grid grid-cols-4 gap-2">
                                                <div className="col-span-2"><InputField label="רחוב" name="street" value={formData.street} onChange={handleChange} placeholder="הזית" type="text" /></div>
                                                <div className="col-span-1"><InputField label="מס'" name="houseNum" value={formData.houseNum} onChange={handleChange} placeholder="10" type="text" /></div>
                                                <div className="col-span-1"><InputField label="עיר" name="city" value={formData.city} onChange={handleChange} placeholder="חיפה" type="text" /></div>
                                            </div>
                                        </div>

                                        {/* עמודה 2 */}
                                        <div className="bg-slate-50 p-4 rounded border border-slate-100">
                                            <h3 className="text-xs font-bold text-slate-400 uppercase mb-4">פרטי הלוואה</h3>
                                            <div className="grid grid-cols-2 gap-3">
                                                <InputField label="סכום הלוואה" name="amount" value={formData.amount} onChange={handleChange} placeholder="5000" type="number" />
                                                <InputField label="סכום במילים" name="amountWords" value={formData.amountWords} onChange={handleChange} placeholder="אוטומטי" type="text" />
                                            </div>
                                            <div className="grid grid-cols-2 gap-3 mt-2 pt-2 border-t border-slate-200">
                                                <InputField label="תשלום חודשי" name="monthlyPayment" value={formData.monthlyPayment} onChange={handleChange} placeholder="500" type="number" />
                                                <InputField label="מס' תשלומים" name="paymentsCount" value={formData.paymentsCount} onChange={handleChange} placeholder="10" type="number" />
                                            </div>
                                            <InputField label="תאריך פירעון ראשון" name="startDate" value={formData.startDate} onChange={handleChange} type="date" />
                                        </div>

                                        {/* עמודה 3 */}
                                        <div className="bg-slate-50 p-4 rounded border border-slate-100">
                                            <h3 className="text-xs font-bold text-slate-400 uppercase mb-4">יצירת קשר ובנק</h3>
                                            <InputField label="טלפון נייד" name="phone" value={formData.phone} onChange={handleChange} placeholder="0500000000" type="tel" />
                                            <InputField label="טלפון נוסף" name="additionalPhone" value={formData.additionalPhone} onChange={handleChange} placeholder="לא חובה" type="tel" required={false} />
                                            <InputField label="דואר אלקטרוני" name="email" value={formData.email} onChange={handleChange} placeholder="mail@example.com" type="email" />
                                            <div className="mt-4 border-t pt-4">
                                                <SelectField label="בנק להפקדה" name="bankName" value={formData.bankName} onChange={handleChange} options={ISRAELI_BANKS} />
                                                <div className="grid grid-cols-2 gap-3">
                                                    <InputField label="סניף" name="bankBranch" value={formData.bankBranch} onChange={handleChange} placeholder="000" type="text" />
                                                    <InputField label="חשבון" name="bankAccount" value={formData.bankAccount} onChange={handleChange} placeholder="000000" type="text" />
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* --- אזור נדרים פלוס --- */}
                                    <div className="mt-8 p-6 bg-blue-50 border border-blue-200 rounded-xl text-center">
                                        <h3 className="text-lg font-bold text-blue-900 mb-2"> הקמת הוראת קבע</h3>
                                        <p className="text-sm text-blue-700 mb-4">לפני שליחת הבקשה יש להקים הוראת קבע בנקאית להחזר ההלוואה.</p>
                                        
                                        {!isNedarimDone ? (
                                            <div>
                                                <button type="button" onClick={openNedarim} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-md transition-all flex items-center justify-center mx-auto gap-2">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                                                    להקמת הוראת קבע (נדרים פלוס)
                                                </button>
                                                
                                                <div className="mt-4 text-xs text-gray-500">
                                                    <label className="flex items-center justify-center gap-2 cursor-pointer">
                                                        <input type="checkbox" onChange={(e) => setIsNedarimDone(e.target.checked)} />
                                                        <span>סיימתי להקים הו"ק, אך המערכת לא התעדכנה</span>
                                                    </label>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="text-green-600 font-bold flex items-center justify-center gap-2 bg-white p-3 rounded-lg border border-green-200 inline-block">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                                הוראת הקבע הוקמה בהצלחה!
                                            </div>
                                        )}
                                        
                                        {/* ה-IFRAME של נדרים - מוגדל + 4 ש"ח + ת"ז */}
                                        {showNedarim && (
                                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                                <div className="bg-white rounded-lg shadow-xl w-full max-w-6xl h-[90vh] flex flex-col">
                                                    <div className="p-2 border-b flex justify-between items-center bg-gray-100">
                                                        <span className="font-bold text-gray-700">נדרים פלוס - הקמת הוראה</span>
                                                        <button type="button" onClick={() => setShowNedarim(false)} className="text-red-500 font-bold px-4 py-1 hover:bg-red-50 rounded">סגור X</button>
                                                    </div>
                                                    <iframe 
                                                        src={`https://www.matara.pro/nedarimplus/online/?S=jKAi&Amount=${parseInt(formData.monthlyPayment) + 4}&ClientName=${formData.firstName} ${formData.lastName}&Zeout=${formData.idNumber}`}
                                                        className="w-full h-full border-none"
                                                    ></iframe>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className="mt-8 flex justify-end">
                                        <button 
                                            type="submit" 
                                            disabled={!isNedarimDone || submitting} 
                                            className={`font-bold py-4 px-12 rounded shadow transition-all flex items-center gap-2 ${(!isNedarimDone || submitting) ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-slate-800 hover:bg-slate-900 text-white'}`}
                                        >
                                            {submitting ? 'שולח...' : 'שלח בקשה '} 
                                            {!submitting && <span>&larr;</span>}
                                        </button>
                                    </div>
                                </form>
                            )}

                            {step === 2 && (
                                <div className="text-center py-10">
                                    <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                        <svg className="text-green-600 w-10 h-10" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>
                                    </div>
                                    <h2 className="text-3xl font-bold text-slate-800 mb-4">הבקשה נקלטה בהצלחה!</h2>
                                    <p className="text-lg text-slate-600">שטר ההלוואה נשלח למייל שלך.</p>
                                </div>
                            )}
                        </div>
                    </div>
                    <div className="mt-6 text-slate-400 text-xs">נבנה עבור קרן אסתר</div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
