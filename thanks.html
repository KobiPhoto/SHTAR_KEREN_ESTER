<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- שורת המפתח לרספונסיביות בסלולר -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>אישור קבלה - קרן אסתר</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600&family=Frank+Ruhl+Libre:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(135deg, #0b192c 0%, #1a2a3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            /* מונע גלילה מיותרת בנייד */
            overflow-x: hidden;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background-color: #ffffff;
            width: 92%; /* תופס כמעט את כל הרוחב בנייד */
            max-width: 480px; /* אבל לא יותר מ-480 פיקסלים במחשב */
            padding: 50px 25px;
            margin: 20px auto;
            border-radius: 4px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
            text-align: center;
            animation: fadeUp 0.8s ease-out forwards;
            position: relative;
            border-top: 5px solid #c5a059;
            box-sizing: border-box;
        }

        .blessing-title {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 2.5rem; /* גודל למחשב */
            color: #c5a059;
            margin: 0;
            line-height: 1.1;
            font-weight: 700;
        }

        .rabbi-signature {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 1.7rem; /* גודל למחשב */
            color: #0b192c;
            margin: 15px 0;
            font-weight: 700;
            line-height: 1.3;
            word-wrap: break-word; /* מונע מהשם לצאת מהכרטיס */
        }

        .status-msg {
            font-size: 1.2rem;
            color: #2c3e50;
            margin: 15px 0;
            font-weight: 400;
        }

        .divider {
            width: 50px;
            height: 1px;
            background-color: #d4af37;
            margin: 25px auto;
            opacity: 0.4;
        }

        p.footer-text {
            font-size: 1.05rem;
            color: #555;
            margin: 0;
            font-weight: 300;
            line-height: 1.5;
        }

        .highlight { color: #c5a059; font-weight: 600; }

        /* התאמות ספציפיות לטלפונים ניידים (מסכים קטנים מ-480px) */
        @media (max-width: 480px) {
            .card {
                padding: 40px 20px; /* צמצום רווחים פנימיים */
                width: 90%;
            }
            .blessing-title {
                font-size: 2.1rem; /* הקטנת הברכה שתיכנס בשורה אחת */
            }
            .rabbi-signature {
                font-size: 1.45rem; /* הקטנת שם הרב */
            }
            .status-msg {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="blessing-title">תזכו למצוות</div>
        <div class="rabbi-signature" id="rabbi-display">הרב שליט"א</div>
        <div class="status-msg">האישור שלך התקבל!</div>
        <div class="divider"></div>
        <p class="footer-text">השותפות שלך עם <span class="highlight">קרן אסתר</span> יקרה לנו מאוד.</p>
    </div>

    <script>
        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            let userName = urlParams.get('u');

            const rabbiElement = document.getElementById('rabbi-display');
            if (userName) {
                const cleanName = userName.replace(/_/g, ' ');
                rabbiElement.innerText = "הרב " + cleanName + " שליט\"א";
            }

            const scriptURL = 'https://script.google.com/macros/s/AKfycbyCzV3MBcvcsDQB-HewMSu7Ccq07basRL-0O5SYdeAc6hYGjF7DG7dtWaJ7hSzCGz1tYw/exec'; 

            if (scriptURL && scriptURL.includes('script.google.com')) {
                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        'user': userName || "אורח"
                    })
                });
            }
        });
    </script>

</body>
</html>
