<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אישור קבלה - קרן אסתר</title>
    
    <!-- ייבוא גופנים -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600&family=Frank+Ruhl+Libre:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(135deg, #0b192c 0%, #1a2a3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 50px 30px;
            margin: 20px;
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            animation: fadeUp 1s ease-out;
            position: relative;
            border-top: 5px solid #c5a059;
        }

        .blessing-title {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 2.6rem;
            color: #c5a059;
            margin: 0;
            line-height: 1.1;
        }

        .rabbi-signature {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 1.6rem;
            color: #0b192c;
            margin: 10px 0 5px 0;
            font-weight: 700;
        }

        .status-msg {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .divider {
            width: 80px;
            height: 1px;
            background-color: #e0e0e0;
            margin: 20px auto;
        }

        h1#greeting {
            font-family: 'Assistant', sans-serif;
            font-size: 1.8rem;
            color: #0b192c;
            margin-top: 10px;
            font-weight: 600;
        }

        p.footer-text {
            font-size: 1rem;
            color: #888;
            margin-top: 30px;
            font-weight: 300;
        }

        .highlight { color: #c5a059; font-weight: 600; }
    </style>
</head>
<body>

    <div class="card">
        <!-- שורה ראשונה: ברכה -->
        <div class="blessing-title">תזכו למצוות</div>
        
        <!-- שורה שנייה: שם הרב (עדכן כאן את השם במידת הצורך) -->
        <div class="rabbi-signature">הרב שליט"א</div>
        
        <!-- שורה שלישית: סטטוס האישור -->
        <div class="status-msg">האישור שלך התקבל!</div>

        <div class="divider"></div>

        <!-- שורה רביעית: פנייה אישית דינמית -->
        <h1 id="greeting">תודה רבה!</h1>
        
        <p class="footer-text">השותפות שלך עם <span class="highlight">קרן אסתר</span> יקרה לנו מאוד.</p>
    </div>

    <script>
        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            let userName = urlParams.get('u');

            if (userName) {
                const cleanName = userName.replace(/_/g, ' ');
                document.getElementById('greeting').innerText = "תודה רבה " + cleanName + "!";
            }

            // הכתובת של הסקריפט החדש (Standalone) שיצרת
            const scriptURL = 'https://script.google.com/macros/s/AKfycbyCzV3MBcvcsDQB-HewMSu7Ccq07basRL-0O5SYdeAc6hYGjF7DG7dtWaJ7hSzCGz1tYw/exec'; 

            if (scriptURL.includes('script.google.com')) {
                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        'user': userName || "אורח"
                    })
                });
            }
        });
    </script>

</body>
</html>
