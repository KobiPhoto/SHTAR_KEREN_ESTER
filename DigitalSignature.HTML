<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>קרן אסתר</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #f8fafc; }
        canvas { touch-action: none; background: #fff; cursor: crosshair; }
        .input-group:focus-within label { color: #1e3a8a; }
        .input-group:focus-within input, .input-group:focus-within select { border-color: #1e3a8a; box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }
        /* עיצוב תיבת הגלילה של ההצהרה */
        .legal-text { max-height: none; overflow-y: auto; background: #f1f5f9; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; line-height: 1.4; color: #334155; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // --- Signature Component ---
        const SignaturePad = ({ onEnd }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth * 2;
                canvas.height = canvas.offsetHeight * 2;
                ctx.scale(2, 2);
                ctx.lineCap = 'round'; ctx.lineWidth = 2; ctx.strokeStyle = '#000';
            }, []);

            const getPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const start = (e) => {
                setIsDrawing(true);
                const ctx = canvasRef.current.getContext('2d');
                const pos = getPos(e);
                ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const ctx = canvasRef.current.getContext('2d');
                const pos = getPos(e);
                ctx.lineTo(pos.x, pos.y); ctx.stroke();
            };

            const end = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                const dataUrl = canvasRef.current.toDataURL("image/png");
                onEnd(dataUrl.replace("data:image/png;base64,", ""));
            };

            const clear = (e) => {
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                onEnd(null);
            };

            return (
                <div className="mt-4">
                    <label className="block text-gray-700 text-sm font-bold mb-2">חתימה בכתב יד (יש לחתום בתוך המסגרת)</label>
                    <div className="border-2 border-dashed border-gray-400 rounded-lg overflow-hidden bg-white relative" style={{height: '180px'}}>
                        <canvas ref={canvasRef} style={{width: '100%', height: '100%'}}
                            onMouseDown={start} onMouseMove={draw} onMouseUp={end} onMouseLeave={end}
                            onTouchStart={start} onTouchMove={draw} onTouchEnd={end} />
                        <button onClick={clear} className="absolute top-2 left-2 text-xs bg-gray-200 px-2 py-1 rounded text-gray-600">נקה</button>
                    </div>
                </div>
            );
        };

        // --- Helpers ---
        const getHebrewDate = () => new Intl.DateTimeFormat('he-IL', { calendar: 'hebrew', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date());

        const numToHebrew = (num) => {
            if (!num) return "";
            const n = parseInt(num);
            const units = ["", "אלף", "אלפיים", "שלושת אלפים", "ארבעת אלפים", "חמשת אלפים", "ששת אלפים", "שבעת אלפים", "שמונת אלפים", "תשעת אלפים", "עשרת אלפים"];
            if (n >= 1000 && n <= 10000 && n % 1000 === 0) return units[n / 1000] + " שקלים";
            if (n === 500) return "חמש מאות שקלים";
            return ""; 
        };

        const ISRAELI_BANKS = [
            { code: '12', name: 'בנק הפועלים' }, { code: '10', name: 'בנק לאומי' }, { code: '11', name: 'בנק דיסקונט' },
            { code: '52', name: 'בנק פאג"י' }, { code: '20', name: 'בנק מזרחי טפחות' }, { code: '17', name: 'בנק מרכנתיל' },
            { code: '31', name: 'הבנק הבינלאומי' }, { code: '09', name: 'בנק הדואר' }, { code: '04', name: 'בנק יהב' },
            { code: '46', name: 'בנק מסד' }, { code: '14', name: 'בנק אוצר החייל' }
        ];

        const isValidIsraeliID = (id) => {
            let strId = String(id).trim();
            if (strId.length > 9 || strId.length < 5) return false;
            strId = strId.padStart(9, '0');
            return Array.from(strId, Number).reduce((counter, digit, i) => {
                const step = digit * ((i % 2) + 1);
                return counter + (step > 9 ? step - 9 : step);
            }) % 10 === 0;
        };

        const isValidMobile = (phone) => /^05\d{8}$/.test(phone);

        const validateSpecificBank = (bankString, accountNum) => {
            if (!accountNum) return ''; 
            const match = bankString.match(/\((\d{2})\)/);
            if (!match) return ''; 
            const bankCode = match[1];
            const len = accountNum.length;
            const isNumeric = /^\d+$/.test(accountNum);
            if (!isNumeric) return 'מספר חשבון חייב להכיל ספרות בלבד';
            switch (bankCode) {
                case '12': if (len !== 6) return 'בבנק הפועלים מס\' החשבון חייב להיות בן 6 ספרות בדיוק'; break;
                case '52': if (len !== 6) return 'בבנק פאג"י מס\' החשבון חייב להיות בן 6 ספרות בדיוק'; break;
                case '10': if (len < 7 || len > 13) return 'בבנק לאומי מס\' החשבון אינו תקין (אורך שגוי)'; break;
                case '11': if (len < 7 || len > 13) return 'בבנק דיסקונט מס\' החשבון אינו תקין (אורך שגוי)'; break;
                default: if (len < 6 || len > 13) return 'מספר חשבון לא תקין';
            }
            return '';
        };

        const InputField = ({ label, type, name, value, onChange, onBlur, placeholder, required = true, error, children }) => (
            <div className="input-group mb-4">
                <label className="block text-gray-600 text-xs font-bold mb-1 tracking-wide">{label}</label>
                <input type={type} name={name} value={value} onChange={onChange} onBlur={onBlur} className={`w-full px-3 py-2 rounded border ${error ? 'border-red-500 bg-red-50' : 'border-gray-300 bg-white'} outline-none transition-all duration-200 text-gray-800 text-sm h-10`} placeholder={placeholder} required={required} />
                {error && <p className="text-red-500 text-xs mt-1">{error}</p>}
                {children}
            </div>
        );

        const SelectField = ({ label, name, value, onChange, options, required = true }) => (
            <div className={`input-group mb-4`}>
                <label className="block text-gray-600 text-xs font-bold mb-1 tracking-wide">{label}</label>
                <select name={name} value={value} onChange={onChange} className="w-full px-3 py-2 rounded border border-gray-300 bg-white outline-none transition-all duration-200 text-gray-800 text-sm h-10" required={required}>
                    <option value="" disabled>בחר בנק...</option>
                    {options.map((opt, idx) => <option key={idx} value={`${opt.name} (${opt.code})`}>{opt.name} ({opt.code})</option>)}
                </select>
            </div>
        );

        // --- Main App ---
        const App = () => {
            // *** עדכן כאן את כתובת הסקריפט החדשה ***
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqay2xSyjmxtuCY6xPmAC25Ztn7VVe8L31ZmigatHXpvazyuVDJj6cvuwsqzJLHYW_1w/exec"; 

            const [step, setStep] = useState(1);
            const [submitting, setSubmitting] = useState(false);
            const [signatureData, setSignatureData] = useState(null);
            const [errors, setErrors] = useState({ idNumber: '', phone: '', bankAccount: '' });
            
            // שדות חדשים לאישורים
            const [forceBankSubmit, setForceBankSubmit] = useState(false);
            const [agreeTerms, setAgreeTerms] = useState(false);

            const [formData, setFormData] = useState({
                amount: '', amountWords: '', 
                firstName: '', lastName: '', idNumber: '', 
                street: '', houseNum: '', city: 'חיפה',
                phone: '', additionalPhone: '', email: '', 
                bankName: '', bankBranch: '', bankAccount: ''
            });

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => {
                    const newData = { ...prev, [name]: value };
                    if (name === 'amount') {
                        const words = numToHebrew(value);
                        if (words) newData.amountWords = words;
                    }
                    return newData;
                });
                if (errors[name]) setErrors({ ...errors, [name]: '' });
                
                // אם משנים חשבון בנק, האישור הידני מתבטל
                if (name === 'bankName' || name === 'bankAccount') setForceBankSubmit(false);
                
                if (name === 'bankName' && formData.bankAccount) {
                    const bankErr = validateSpecificBank(value, formData.bankAccount);
                    setErrors(prev => ({ ...prev, bankAccount: bankErr }));
                }
            };

            const handleBlur = (e) => {
                const { name, value } = e.target;
                let errorMsg = '';
                if (name === 'idNumber' && value && !isValidIsraeliID(value)) errorMsg = 'מספר זהות אינו תקין';
                else if (name === 'phone' && value && !isValidMobile(value)) errorMsg = 'מספר נייד לא תקין';
                else if (name === 'bankAccount' && value) {
                    if (formData.bankName) errorMsg = validateSpecificBank(formData.bankName, value);
                    else if (!/^\d{6,13}$/.test(value)) errorMsg = 'מספר חשבון לא תקין';
                }
                setErrors(prev => ({ ...prev, [name]: errorMsg }));
            };

            const handleSubmitForm = async (e) => {
                e.preventDefault();
                
                const idErr = (!isValidIsraeliID(formData.idNumber)) ? 'מספר זהות אינו תקין' : '';
                const phoneErr = (!isValidMobile(formData.phone)) ? 'מספר נייד לא תקין' : '';
                const bankErr = validateSpecificBank(formData.bankName, formData.bankAccount);
                setErrors({ idNumber: idErr, phone: phoneErr, bankAccount: bankErr });

                if (idErr || phoneErr) return;
                
                // לוגיקה לעקיפת שגיאת בנק
                if (bankErr && !forceBankSubmit) {
                    return; // חוסם שליחה אם יש שגיאה בבנק והמשתמש לא אישר
                }

                if (!signatureData) {
                    alert("אנא חתום בתיבה הייעודית לפני השליחה");
                    return;
                }

                if (!agreeTerms) {
                    alert("יש לאשר את תנאי ההצהרה לפני השליחה");
                    return;
                }

                setSubmitting(true);
                
                const dataToSend = { 
                    ...formData, 
                    address: `${formData.street} ${formData.houseNum}, ${formData.city}`,
                    hebrewDate: getHebrewDate(),
                    signature: signatureData
                };
                
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(dataToSend)
                    });
                    setTimeout(() => { setSubmitting(false); setStep(2); }, 3000);
                } catch (error) {
                    setStep(2); setSubmitting(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col items-center py-6 px-4">
                    <div className="text-center mb-6 w-full max-w-5xl">
                        <h1 className="text-3xl font-bold text-slate-800">קרן אסתר - ע.ר. 580021475</h1>
                        <p className="text-slate-500 text-sm">שטר הלוואה בחתימה דיגיטלית</p>
                    </div>

                    <div className="w-full max-w-4xl bg-white rounded shadow-xl overflow-hidden border-t-4 border-blue-800 p-8">
                        {step === 1 ? (
                            <form onSubmit={handleSubmitForm}>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <h3 className="font-bold text-blue-800 mb-3">פרטים אישיים</h3>
                                        <InputField label="שם פרטי" name="firstName" value={formData.firstName} onChange={handleChange} placeholder="" type="text" />
                                        <InputField label="שם משפחה" name="lastName" value={formData.lastName} onChange={handleChange} placeholder="" type="text" />
                                        <InputField label="ת.ז" name="idNumber" value={formData.idNumber} onChange={handleChange} onBlur={handleBlur} error={errors.idNumber} placeholder="" type="text" />
                                        <InputField label="טלפון נייד" name="phone" value={formData.phone} onChange={handleChange} onBlur={handleBlur} error={errors.phone} placeholder="" type="tel" />
                                        <InputField label="מייל" name="email" value={formData.email} onChange={handleChange} placeholder="" type="email" />
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-blue-800 mb-3">פרטי הלוואה</h3>
                                        <InputField label="סכום הלוואה" name="amount" value={formData.amount} onChange={handleChange} placeholder="" type="number" />
                                        <InputField label="סכום במילים" name="amountWords" value={formData.amountWords} onChange={handleChange} placeholder="" type="text" />
                                        
                                        <h3 className="font-bold text-blue-800 mb-3 mt-4">כתובת</h3>
                                        <div className="grid grid-cols-3 gap-2">
                                            <div className="col-span-2"><InputField label="רחוב" name="street" value={formData.street} onChange={handleChange} placeholder="" type="text" /></div>
                                            <div><InputField label="מס'" name="houseNum" value={formData.houseNum} onChange={handleChange} placeholder="" type="text" /></div>
                                        </div>
                                        <InputField label="עיר" name="city" value={formData.city} onChange={handleChange} placeholder="" type="text" />
                                    </div>
                                </div>

                                <div className="mt-4 pt-4 border-t">
                                    <h3 className="font-bold text-gray-700 mb-2">פרטי בנק</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <SelectField label="בנק" name="bankName" value={formData.bankName} onChange={handleChange} options={ISRAELI_BANKS} />
                                        <InputField label="סניף" name="bankBranch" value={formData.bankBranch} onChange={handleChange} placeholder="" type="text" />
                                        <InputField 
                                            label="חשבון" 
                                            name="bankAccount" 
                                            value={formData.bankAccount} 
                                            onChange={handleChange} 
                                            onBlur={handleBlur} 
                                            error={errors.bankAccount} 
                                            placeholder="" 
                                            type="text"
                                        >
                                            {/* תיבת סימון לעקיפת שגיאת בנק - מופיעה רק כשיש שגיאה */}
                                            {errors.bankAccount && (
                                                <div className="mt-2 flex items-start bg-red-50 p-2 rounded">
                                                    <input 
                                                        type="checkbox" 
                                                        id="forceBank" 
                                                        checked={forceBankSubmit} 
                                                        onChange={(e) => setForceBankSubmit(e.target.checked)}
                                                        className="mt-1 ml-2 h-4 w-4"
                                                    />
                                                    <label htmlFor="forceBank" className="text-xs text-red-700 cursor-pointer font-bold select-none">
                                                        מספר החשבון תקין, אשר בכל זאת
                                                    </label>
                                                </div>
                                            )}
                                        </InputField>
                                    </div>
                                </div>

                                {/* הצהרה משפטית */}
                                <div className="mt-6">
                                    <h3 className="font-bold text-gray-700 mb-2">הצהרה וחתימה</h3>
                                    <div className="legal-text">
                                    <strong> אני מתחייב בחתימתי זו לפרוע את ההלוואה לא יאוחר מיום ראשון י"ב אדר התשפ"ו 01/03/2026. <strong> <br/>
הנני מאשר בחתימתי כי ההלוואה היא ע"פ תקנון הגמ"ח על כל פרטיו.<br/>
הנני מאשר שכל בעיה שתתעורר בגין שטר זה תתברר ע"י בית דין שיקבע ע"י הנהלת הגמ"ח.<br/>
הנני מאשר שלא אוכל לטעון 'פרעתי' כל זמן שלא אוכיח זאת ע"י שובר מהנהלת הגמ"ח.<br/>
הנני מקבל על עצמי לשלם את כל ההוצאות שיגרמו עקב אי תשלום החוב בזמנו כולל שכירות אדם מיוחד שיופיע בשם הגמ"ח בפני בי"ד.<br/>
                                        ידוע לי כי קבלת ההלוואה כפופה לאישור הנהלת הגמ"ח. <br/>
                                        אני מתחייב לעמוד בתנאי ההחזר כפי שנקבעו, וכי החתימה הדיגיטלית להלן מחייבת אותי לכל דבר ועניין כאילו נחתמה בכתב ידי.
                                    </div>
                                </div>

                                {/* רכיב החתימה */}
                                <div className="bg-blue-50 p-4 rounded border border-blue-100">
                                    <SignaturePad onEnd={setSignatureData} />
                                </div>

                                {/* צ'קבוקס אישור כללי */}
                                <div className="mt-4 flex items-center">
                                    <input 
                                        type="checkbox" 
                                        id="agreeTerms" 
                                        checked={agreeTerms}
                                        onChange={(e) => setAgreeTerms(e.target.checked)}
                                        className="h-5 w-5 text-blue-600 ml-3" 
                                    />
                                    <label htmlFor="agreeTerms" className="text-gray-800 font-bold cursor-pointer select-none">
                                        קראתי ואני מאשר/ת את כל הפרטים והתנאים
                                    </label>
                                </div>

                                <div className="mt-8 text-center">
                                    <button type="submit" disabled={submitting} className={`bg-blue-800 hover:bg-blue-900 text-white font-bold py-4 px-12 rounded-full shadow-lg text-lg ${submitting ? 'opacity-70 cursor-wait' : ''}`}>
                                        {submitting ? 'שולח...' : 'שלח בקשה חתומה'}
                                    </button>
                                </div>
                            </form>
                        ) : (
                            <div className="text-center py-10">
                                <h2 className="text-3xl font-bold text-green-600 mb-4">הטופס נחתם והתקבל בהצלחה!</h2>
                                <p className="text-gray-600">העתק מהשטר החתום נשלח למייל שלך.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
