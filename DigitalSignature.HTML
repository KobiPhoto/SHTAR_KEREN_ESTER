<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>גמ"ח קרן אסתר - בקשת הלוואה</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #f1f5f9; }
        .input-group:focus-within label { color: #1e3a8a; }
        .input-group:focus-within input, .input-group:focus-within select { border-color: #1e3a8a; box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }
        
        /* Loader */
        .loader-dots div { animation-timing-function: cubic-bezier(0, 1, 1, 0); }
        .loader-dots div:nth-child(1) { left: 8px; animation: loader-dots1 0.6s infinite; }
        .loader-dots div:nth-child(2) { left: 8px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(3) { left: 32px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(4) { left: 56px; animation: loader-dots3 0.6s infinite; }
        @keyframes loader-dots1 { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes loader-dots3 { 0% { transform: scale(1); } 100% { transform: scale(0); } }
        @keyframes loader-dots2 { 0% { transform: translate(0, 0); } 100% { transform: translate(24px, 0); } }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Helpers ---
        const getHebrewDate = () => new Intl.DateTimeFormat('he-IL', { calendar: 'hebrew', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date());

        const numToHebrew = (num) => {
            if (!num) return "";
            const n = parseInt(num);
            const units = ["", "אלף", "אלפיים", "שלושת אלפים", "ארבעת אלפים", "חמשת אלפים", "ששת אלפים", "שבעת אלפים", "שמונת אלפים", "תשעת אלפים", "עשרת אלפים"];
            if (n >= 1000 && n <= 10000 && n % 1000 === 0) return units[n / 1000] + " שקלים";
            if (n === 500) return "חמש מאות שקלים";
            return ""; 
        };

        const ISRAELI_BANKS = [
            { code: '12', name: 'בנק הפועלים' }, { code: '10', name: 'בנק לאומי' }, { code: '11', name: 'בנק דיסקונט' },
            { code: '52', name: 'בנק פאג"י' }, { code: '20', name: 'בנק מזרחי טפחות' }, { code: '17', name: 'בנק מרכנתיל' },
            { code: '31', name: 'הבנק הבינלאומי' }, { code: '09', name: 'בנק הדואר' }, { code: '04', name: 'בנק יהב' }
        ];

        const InputField = ({ label, type, name, value, onChange, placeholder, required = true, className }) => (
            <div className={`input-group mb-4 ${className}`}>
                <label className="block text-gray-600 text-xs font-bold mb-1 tracking-wide">{label}</label>
                <input type={type} name={name} value={value} onChange={onChange} className="w-full px-3 py-2 rounded border border-gray-300 bg-white outline-none transition-all duration-200 text-gray-800 text-sm h-10" placeholder={placeholder} required={required} />
            </div>
        );

        const SelectField = ({ label, name, value, onChange, options, required = true }) => (
            <div className={`input-group mb-4`}>
                <label className="block text-gray-600 text-xs font-bold mb-1 tracking-wide">{label}</label>
                <select name={name} value={value} onChange={onChange} className="w-full px-3 py-2 rounded border border-gray-300 bg-white outline-none transition-all duration-200 text-gray-800 text-sm h-10" required={required}>
                    <option value="" disabled>בחר בנק...</option>
                    {options.map((opt, idx) => <option key={idx} value={`${opt.name} (${opt.code})`}>{opt.name} ({opt.code})</option>)}
                </select>
            </div>
        );

        const ProcessingOverlay = ({ text }) => (
            <div className="fixed inset-0 bg-gray-900 bg-opacity-75 flex flex-col items-center justify-center z-50">
                <div className="bg-white p-8 rounded-xl shadow-2xl flex flex-col items-center max-w-sm w-full">
                    <div className="loader-dots relative w-20 h-5 mb-4">
                        <div className="absolute top-0 w-3 h-3 rounded-full bg-blue-600"></div><div className="absolute top-0 w-3 h-3 rounded-full bg-blue-600"></div><div className="absolute top-0 w-3 h-3 rounded-full bg-blue-600"></div><div className="absolute top-0 w-3 h-3 rounded-full bg-blue-600"></div>
                    </div>
                    <h3 className="text-xl font-bold text-gray-800 mb-2">אנא המתן...</h3>
                    <p className="text-blue-600 font-medium animate-pulse">{text}</p>
                </div>
            </div>
        );

        // --- Main App ---
        const App = () => {
            // *** עדכן כאן את הכתובת של ה-APP SCRIPT שלך ***
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqay2xSyjmxtuCY6xPmAC25Ztn7VVe8L31ZmigatHXpvazyuVDJj6cvuwsqzJLHYW_1w/exec"; 

            const [step, setStep] = useState(1);
            const [submitting, setSubmitting] = useState(false);
            const [loadingText, setLoadingText] = useState("שומר נתונים...");
            
            const [formData, setFormData] = useState({
                amount: '', amountWords: '', 
                firstName: '', lastName: '', idNumber: '', 
                street: '', houseNum: '', city: 'חיפה',
                phone: '', additionalPhone: '', email: '', 
                bankName: '', bankBranch: '', bankAccount: ''
            });

            const guarantorsCount = (!formData.amount) ? 0 : (parseInt(formData.amount) <= 10000 ? 2 : 2 + Math.ceil((parseInt(formData.amount) - 10000) / 10000));

            useEffect(() => {
                let interval;
                if (submitting) {
                    const texts = ["שומר נתונים...", "מפיק שטר הלוואה...", "שולח מייל..."];
                    let i = 0;
                    interval = setInterval(() => { i = (i + 1) % texts.length; setLoadingText(texts[i]); }, 1500);
                }
                return () => clearInterval(interval);
            }, [submitting]);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => {
                    const newData = { ...prev, [name]: value };
                    if (name === 'amount') {
                        const words = numToHebrew(value);
                        if (words) newData.amountWords = words;
                    }
                    return newData;
                });
            };

            const handleSubmitForm = async (e) => {
                e.preventDefault(); // מניעת רענון דף
                setSubmitting(true);
                
                const dataToSend = { 
                    ...formData, 
                    address: `${formData.street} ${formData.houseNum}, ${formData.city}`,
                    hebrewDate: getHebrewDate()
                };

                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(dataToSend)
                    });
                    // בגלל no-cors, פשוט נחכה קצת ונניח שהצליח
                    setTimeout(() => { 
                        setSubmitting(false); 
                        setStep(2); // עבור למסך הסיום
                    }, 2500);
                } catch (error) {
                    setStep(2); // גם אם יש שגיאה, נמשיך למסך הסיום
                    setSubmitting(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col items-center py-6 px-4">
                    {submitting && <ProcessingOverlay text={loadingText} />}
                    
                    <div className="text-center mb-6 w-full max-w-5xl">
                        <h1 className="text-3xl font-bold text-slate-800">קרן אסתר - בקשת הלוואה</h1>
                    </div>

                    <div className="w-full max-w-6xl bg-white rounded shadow-2xl overflow-hidden border-t-4 border-blue-800">
                        <div className="p-8">
                            {/* שלב 1: טופס */}
                            {step === 1 && (
                                <form onSubmit={handleSubmitForm}> {/* שינוי כאן: קריאה ישירה לפונקציית השליחה */}
                                    <div className="flex items-center justify-between mb-6">
                                        <h2 className="text-xl font-bold text-slate-800 border-r-4 border-blue-800 pr-3">פרטי הלוואה ולווה</h2>
                                        {formData.amount && (
                                            <div className="bg-blue-50 text-blue-800 px-4 py-1 rounded text-sm font-bold">
                                                נדרשים: {guarantorsCount} ערבים
                                            </div>
                                        )}
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        {/* עמודה 1 */}
                                        <div className="bg-slate-50 p-4 rounded border">
                                            <h3 className="text-xs font-bold text-gray-500 uppercase mb-4">פרטי אישיים</h3>
                                            <div className="grid grid-cols-2 gap-3">
                                                <InputField label="שם פרטי" name="firstName" value={formData.firstName} onChange={handleChange} placeholder="" type="text" />
                                                <InputField label="שם משפחה" name="lastName" value={formData.lastName} onChange={handleChange} placeholder="" type="text" />
                                            </div>
                                            <InputField label="ת.ז" name="idNumber" value={formData.idNumber} onChange={handleChange} placeholder="" type="text" />
                                            <div className="grid grid-cols-4 gap-2">
                                                <div className="col-span-2"><InputField label="רחוב" name="street" value={formData.street} onChange={handleChange} placeholder="" type="text" /></div>
                                                <div className="col-span-1"><InputField label="מס'" name="houseNum" value={formData.houseNum} onChange={handleChange} placeholder="" type="text" /></div>
                                                <div className="col-span-1"><InputField label="עיר" name="city" value={formData.city} onChange={handleChange} placeholder="" type="text" /></div>
                                            </div>
                                        </div>

                                        {/* עמודה 2 */}
                                        <div className="bg-slate-50 p-4 rounded border">
                                            <h3 className="text-xs font-bold text-gray-500 uppercase mb-4">פרטי הלוואה</h3>
                                            <div className="grid grid-cols-2 gap-3">
                                                <InputField label="סכום (ש&quot;ח)" name="amount" value={formData.amount} onChange={handleChange} placeholder="5000" type="number" />
                                                <InputField label="במילים" name="amountWords" value={formData.amountWords} onChange={handleChange} placeholder="" type="text" />
                                            </div>
                                            <InputField label="טלפון נייד" name="phone" value={formData.phone} onChange={handleChange} placeholder="" type="tel" />
                                            <InputField label="טלפון נוסף" name="additionalPhone" value={formData.additionalPhone} onChange={handleChange} placeholder="" type="tel" required={false} />
                                            <InputField label="מייל" name="email" value={formData.email} onChange={handleChange} placeholder="" type="email" />
                                        </div>

                                        {/* עמודה 3 */}
                                        <div className="bg-slate-50 p-4 rounded border">
                                            <h3 className="text-xs font-bold text-gray-500 uppercase mb-4">חשבון להפקדה</h3>
                                            <SelectField label="בנק" name="bankName" value={formData.bankName} onChange={handleChange} options={ISRAELI_BANKS} />
                                            <div className="grid grid-cols-2 gap-3">
                                                <InputField label="סניף" name="bankBranch" value={formData.bankBranch} onChange={handleChange} placeholder="" type="text" />
                                                <InputField label="חשבון" name="bankAccount" value={formData.bankAccount} onChange={handleChange} placeholder="" type="text" />
                                            </div>
                                        </div>
                                    </div>
                                    <div className="mt-8 flex justify-end">
                                        <button type="submit" className="bg-blue-800 hover:bg-blue-900 text-white font-bold py-3 px-12 rounded shadow transition-all">
                                            שלח בקשה &larr;
                                        </button>
                                    </div>
                                </form>
                            )}

                            {/* שלב 2: סיום (החלפנו את שלב 3 להיות 2) */}
                            {step === 2 && (
                                <div className="max-w-2xl mx-auto text-center py-6">
                                    <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                        <svg className="text-green-600 w-10 h-10" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>
                                    </div>
                                    <h2 className="text-3xl font-bold text-slate-800 mb-4">הבקשה נקלטה בהצלחה!</h2>
                                    <p className="text-lg text-slate-600 mb-8">
                                        שטר ההלוואה נשלח למייל: <span className="font-bold">{formData.email}</span>.
                                    </p>
                                    <div className="bg-slate-50 border p-4 text-center rounded max-w-md mx-auto">
                                        <p className="text-sm text-slate-700">
                                            כעת יש להדפיס את השטר מהמייל, לחתום ולהעביר את המקור.
                                        </p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    <div className="mt-6 text-slate-400 text-xs">© כל הזכויות שמורות לגמ"ח קרן אסתר</div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
