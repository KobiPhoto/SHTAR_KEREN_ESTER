<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>קרן אסתר - חתימה דיגיטלית</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #f8fafc; }
        /* מונע גלילה בזמן חתימה בנייד */
        canvas { touch-action: none; background: #fff; cursor: crosshair; }
        .input-group:focus-within label { color: #1e3a8a; }
        .input-group:focus-within input, .input-group:focus-within select { border-color: #1e3a8a; box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // --- Signature Pad Component ---
        const SignaturePad = ({ onEnd }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                // רזולוציה גבוהה
                canvas.width = canvas.offsetWidth * 2;
                canvas.height = canvas.offsetHeight * 2;
                ctx.scale(2, 2);
                ctx.lineCap = 'round';
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
            }, []);

            const getPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            const start = (e) => {
                setIsDrawing(true);
                const ctx = canvasRef.current.getContext('2d');
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault(); // מניעת גלילה בנייד
                const ctx = canvasRef.current.getContext('2d');
                const pos = getPos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const end = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                const dataUrl = canvasRef.current.toDataURL("image/png");
                // הסרת הקידומת כדי לשלוח רק את ה-Base64
                onEnd(dataUrl.replace("data:image/png;base64,", ""));
            };

            const clear = (e) => {
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                onEnd(null); // איפוס
            };

            return (
                <div className="mt-4">
                    <label className="block text-gray-700 text-sm font-bold mb-2">חתימה דיגיטלית (חובה לחתום בתוך המסגרת)</label>
                    <div className="border-2 border-dashed border-gray-400 rounded-lg overflow-hidden bg-white relative" style={{height: '200px'}}>
                        <canvas 
                            ref={canvasRef}
                            style={{width: '100%', height: '100%'}}
                            onMouseDown={start} onMouseMove={draw} onMouseUp={end} onMouseLeave={end}
                            onTouchStart={start} onTouchMove={draw} onTouchEnd={end}
                        />
                        <button onClick={clear} className="absolute top-2 left-2 text-xs bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded text-gray-600">
                            נקה חתימה
                        </button>
                    </div>
                    <p className="text-xs text-gray-500 mt-1">ניתן לחתום עם האצבע או העכבר</p>
                </div>
            );
        };

        // --- Main Form Helpers ---
        const getHebrewDate = () => {
            return new Intl.DateTimeFormat('he-IL', { calendar: 'hebrew', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date());
        };

        const numToHebrew = (num) => {
            if (!num) return "";
            const n = parseInt(num);
            const units = ["", "אלף", "אלפיים", "שלושת אלפים", "ארבעת אלפים", "חמשת אלפים", "ששת אלפים", "שבעת אלפים", "שמונת אלפים", "תשעת אלפים", "עשרת אלפים"];
            if (n >= 1000 && n <= 10000 && n % 1000 === 0) return units[n / 1000] + " שקלים";
            if (n === 500) return "חמש מאות שקלים";
            return ""; 
        };

        const ISRAELI_BANKS = [
            { code: '12', name: 'בנק הפועלים' }, { code: '10', name: 'בנק לאומי' }, { code: '11', name: 'בנק דיסקונט' },
            { code: '52', name: 'בנק פאג"י' }, { code: '20', name: 'בנק מזרחי טפחות' }, { code: '17', name: 'בנק מרכנתיל' },
            { code: '31', name: 'הבנק הבינלאומי' }, { code: '09', name: 'בנק הדואר' }, { code: '04', name: 'בנק יהב' }
        ];

        const InputField = ({ label, type, name, value, onChange, placeholder, required = true }) => (
            <div className="input-group mb-4">
                <label className="block text-gray-600 text-xs font-bold mb-1 tracking-wide">{label}</label>
                <input type={type} name={name} value={value} onChange={onChange} className="w-full px-3 py-2 rounded border border-gray-300 bg-white outline-none transition-all duration-200 text-gray-800 text-sm h-10" placeholder={placeholder} required={required} />
            </div>
        );

        // --- Main App ---
        const App = () => {
            // *** עדכן כאן את הכתובת החדשה של הסקריפט (גרסת חתימה) ***
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqay2xSyjmxtuCY6xPmAC25Ztn7VVe8L31ZmigatHXpvazyuVDJj6cvuwsqzJLHYW_1w/exec"; 

            const [step, setStep] = useState(1);
            const [submitting, setSubmitting] = useState(false);
            const [signatureData, setSignatureData] = useState(null);

            const [formData, setFormData] = useState({
                amount: '', amountWords: '', monthlyPayment: '', paymentsCount: '', startDate: '',
                firstName: '', lastName: '', idNumber: '', 
                street: '', houseNum: '', city: 'חיפה',
                phone: '', additionalPhone: '', email: '', 
                bankName: '', bankBranch: '', bankAccount: ''
            });

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => {
                    const newData = { ...prev, [name]: value };
                    if (name === 'amount') {
                        const words = numToHebrew(value);
                        if (words) newData.amountWords = words;
                    }
                    return newData;
                });
            };

            const handleSubmitForm = async (e) => {
                e.preventDefault();
                if (!signatureData) {
                    alert("אנא חתום בתיבה הייעודית לפני השליחה");
                    return;
                }

                setSubmitting(true);
                
                const dataToSend = { 
                    ...formData, 
                    address: `${formData.street} ${formData.houseNum}, ${formData.city}`,
                    hebrewDate: getHebrewDate(),
                    signature: signatureData // שליחת תמונה
                };
                
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(dataToSend)
                    });
                    setTimeout(() => { setSubmitting(false); setStep(2); }, 3000);
                } catch (error) {
                    setStep(2); setSubmitting(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col items-center py-6 px-4">
                    <div className="text-center mb-6 w-full max-w-5xl">
                        <h1 className="text-3xl font-bold text-slate-800">קרן אסתר - חתימה דיגיטלית</h1>
                    </div>

                    <div className="w-full max-w-4xl bg-white rounded shadow-xl overflow-hidden border-t-4 border-blue-800 p-8">
                        {step === 1 ? (
                            <form onSubmit={handleSubmitForm}>
                                <h2 className="text-xl font-bold text-blue-800 border-r-4 border-blue-800 pr-3 mb-6">פרטי בקשה וחתימה</h2>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <InputField label="שם פרטי" name="firstName" value={formData.firstName} onChange={handleChange} placeholder="" type="text" />
                                        <InputField label="שם משפחה" name="lastName" value={formData.lastName} onChange={handleChange} placeholder="" type="text" />
                                        <InputField label="ת.ז" name="idNumber" value={formData.idNumber} onChange={handleChange} placeholder="" type="text" />
                                        <InputField label="טלפון נייד" name="phone" value={formData.phone} onChange={handleChange} placeholder="" type="tel" />
                                        <InputField label="מייל" name="email" value={formData.email} onChange={handleChange} placeholder="" type="email" />
                                    </div>
                                    <div>
                                        <InputField label="סכום הלוואה" name="amount" value={formData.amount} onChange={handleChange} placeholder="" type="number" />
                                        <InputField label="סכום במילים" name="amountWords" value={formData.amountWords} onChange={handleChange} placeholder="" type="text" />
                                        
                                        <div className="grid grid-cols-2 gap-2">
                                            <InputField label="תשלום חודשי" name="monthlyPayment" value={formData.monthlyPayment} onChange={handleChange} placeholder="" type="number" />
                                            <InputField label="מס' תשלומים" name="paymentsCount" value={formData.paymentsCount} onChange={handleChange} placeholder="" type="number" />
                                        </div>
                                        <InputField label="תאריך פירעון ראשון" name="startDate" value={formData.startDate} onChange={handleChange} type="date" />
                                    </div>
                                </div>

                                <div className="mt-4 pt-4 border-t">
                                    <h3 className="font-bold text-gray-700 mb-2">פרטי בנק ומגורים</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <InputField label="בנק" name="bankName" value={formData.bankName} onChange={handleChange} placeholder="" type="text" />
                                        <InputField label="סניף" name="bankBranch" value={formData.bankBranch} onChange={handleChange} placeholder="" type="text" />
                                        <InputField label="חשבון" name="bankAccount" value={formData.bankAccount} onChange={handleChange} placeholder="" type="text" />
                                    </div>
                                    <div className="grid grid-cols-3 gap-4">
                                        <InputField label="עיר" name="city" value={formData.city} onChange={handleChange} placeholder="" type="text" />
                                        <InputField label="רחוב" name="street" value={formData.street} onChange={handleChange} placeholder="" type="text" />
                                        <InputField label="מס' בית" name="houseNum" value={formData.houseNum} onChange={handleChange} placeholder="" type="text" />
                                    </div>
                                </div>

                                {/* רכיב החתימה */}
                                <div className="mt-6 bg-blue-50 p-4 rounded">
                                    <SignaturePad onEnd={setSignatureData} />
                                </div>

                                <div className="mt-8 text-center">
                                    <button type="submit" disabled={submitting} className={`bg-blue-800 hover:bg-blue-900 text-white font-bold py-4 px-12 rounded-full shadow-lg text-lg ${submitting ? 'opacity-70 cursor-wait' : ''}`}>
                                        {submitting ? 'מעבד נתונים...' : 'שלח בקשה חתומה'}
                                    </button>
                                </div>
                            </form>
                        ) : (
                            <div className="text-center py-10">
                                <h2 className="text-3xl font-bold text-green-600 mb-4">הטופס נחתם והתקבל בהצלחה!</h2>
                                <p className="text-gray-600">העתק נשלח למייל שלך.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
