<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>גמ"ח קרן אסתר - טופס בקשה</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #f1f5f9; }
        .font-serif-title { font-family: 'Frank Ruhl Libre', serif; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .input-group:focus-within label { color: #1e3a8a; }
        .input-group:focus-within input, .input-group:focus-within select { border-color: #1e3a8a; box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }
        
        /* Loader Animation */
        .loader-dots div { animation-timing-function: cubic-bezier(0, 1, 1, 0); }
        .loader-dots div:nth-child(1) { left: 8px; animation: loader-dots1 0.6s infinite; }
        .loader-dots div:nth-child(2) { left: 8px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(3) { left: 32px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(4) { left: 56px; animation: loader-dots3 0.6s infinite; }
        @keyframes loader-dots1 { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes loader-dots3 { 0% { transform: scale(1); } 100% { transform: scale(0); } }
        @keyframes loader-dots2 { 0% { transform: translate(0, 0); } 100% { transform: translate(24px, 0); } }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // *** הדבק כאן את הכתובת החדשה של ה-APP SCRIPT ***
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNAlwhFVlUnyYpPhjUaw_CWlvigtRJOEmM7qyFNHvXo0eksT9diQkcJsfUL8wogKGB-g/exec"; 
        
        const ISRAELI_BANKS = [
            { code: '12', name: 'בנק הפועלים' }, { code: '10', name: 'בנק לאומי' }, { code: '11', name: 'בנק דיסקונט' },
            { code: '52', name: 'בנק פאג"י' }, { code: '20', name: 'בנק מזרחי טפחות' }, { code: '17', name: 'בנק מרכנתיל' },
            { code: '31', name: 'הבנק הבינלאומי' }, { code: '09', name: 'בנק הדואר' }, { code: '04', name: 'בנק יהב' },
            { code: '46', name: 'בנק מסד' }, { code: '14', name: 'בנק אוצר החייל' }
        ];

        const calculateGuarantors = (amount) => {
            if (!amount) return 0;
            const num = parseInt(amount);
            return num <= 10000 ? 2 : 2 + Math.ceil((num - 10000) / 10000);
        };

        const isValidIsraeliID = (id) => {
            let strId = String(id).trim();
            if (strId.length > 9 || strId.length < 5) return false;
            strId = strId.padStart(9, '0');
            return Array.from(strId, Number).reduce((counter, digit, i) => {
                const step = digit * ((i % 2) + 1);
                return counter + (step > 9 ? step - 9 : step);
            }) % 10 === 0;
        };

        const isValidMobile = (phone) => /^05\d{8}$/.test(phone);

        const validateSpecificBank = (bankString, accountNum) => {
            if (!accountNum) return ''; 
            const match = bankString.match(/\((\d{2})\)/);
            if (!match) return ''; 
            const bankCode = match[1];
            const len = accountNum.length;
            const isNumeric = /^\d+$/.test(accountNum);
            if (!isNumeric) return 'מספר חשבון חייב להכיל ספרות בלבד';
            switch (bankCode) {
                case '12': if (len !== 6) return 'בבנק הפועלים מס\' החשבון חייב להיות בן 6 ספרות בדיוק'; break;
                case '52': if (len !== 6) return 'בבנק פאג"י מס\' החשבון חייב להיות בן 6 ספרות בדיוק'; break;
                case '10': if (len < 7 || len > 13) return 'בבנק לאומי מס\' החשבון אינו תקין (אורך שגוי)'; break;
                case '11': if (len < 7 || len > 13) return 'בבנק דיסקונט מס\' החשבון אינו תקין (אורך שגוי)'; break;
                default: if (len < 6 || len > 13) return 'מספר חשבון לא תקין';
            }
            return '';
        };

        const InputField = ({ label, type, name, value, onChange, onBlur, placeholder, required = true, error, className, children }) => (
            <div className={`input-group mb-4 ${className}`}>
                <label className="block text-gray-600 text-xs font-bold mb-1 tracking-wide">{label} {required && <span className="text-red-500">*</span>}</label>
                <input type={type} name={name} value={value} onChange={onChange} onBlur={onBlur} className={`w-full px-3 py-2 rounded border ${error ? 'border-red-500 bg-red-50' : 'border-gray-300 bg-white'} outline-none transition-all duration-200 text-gray-800 text-sm h-10`} placeholder={placeholder} required={required} />
                {error && <p className="text-red-500 text-xs mt-1 font-medium flex items-center"><span className="mr-1">⚠</span> {error}</p>}
                {children}
            </div>
        );

        const SelectField = ({ label, name, value, onChange, options, required = true }) => (
            <div className={`input-group mb-4`}>
                <label className="block text-gray-600 text-xs font-bold mb-1 tracking-wide">{label} {required && <span className="text-red-500">*</span>}</label>
                <select name={name} value={value} onChange={onChange} className="w-full px-3 py-2 rounded border border-gray-300 bg-white outline-none transition-all duration-200 text-gray-800 text-sm h-10" required={required}>
                    <option value="" disabled>בחר בנק...</option>
                    {options.map((opt, idx) => <option key={idx} value={`${opt.name} (${opt.code})`}>{opt.name} ({opt.code})</option>)}
                </select>
            </div>
        );

        // --- Loader Component ---
        const ProcessingOverlay = ({ text }) => (
            <div className="fixed inset-0 bg-gray-900 bg-opacity-75 flex flex-col items-center justify-center z-50">
                <div className="bg-white p-8 rounded-xl shadow-2xl flex flex-col items-center max-w-sm w-full">
                    <div className="loader-dots relative w-20 h-5 mb-4">
                        <div className="absolute top-0 w-3 h-3 rounded-full bg-blue-600"></div>
                        <div className="absolute top-0 w-3 h-3 rounded-full bg-blue-600"></div>
                        <div className="absolute top-0 w-3 h-3 rounded-full bg-blue-600"></div>
                        <div className="absolute top-0 w-3 h-3 rounded-full bg-blue-600"></div>
                    </div>
                    <h3 className="text-xl font-bold text-gray-800 mb-2">אנא המתן...</h3>
                    <p className="text-blue-600 font-medium animate-pulse">{text}</p>
                </div>
            </div>
        );

        // --- Main App ---
        const App = () => {
            const [step, setStep] = useState(1);
            const [submitting, setSubmitting] = useState(false);
            const [loadingText, setLoadingText] = useState("שומר נתונים...");
            const [errors, setErrors] = useState({ idNumber: '', phone: '', bankAccount: '' });
            const [forceBankSubmit, setForceBankSubmit] = useState(false);

            const [formData, setFormData] = useState({
                amount: '', amountWords: '', firstName: '', lastName: '', idNumber: '', 
                street: '', houseNum: '', city: 'חיפה', // שדות כתובת נפרדים
                phone: '', additionalPhone: '', email: '', 
                bankName: '', bankBranch: '', bankAccount: ''
            });

            const guarantorsCount = calculateGuarantors(formData.amount);

            // אפקט לאנימציית הטקסטים
            useEffect(() => {
                let interval;
                if (submitting) {
                    const texts = ["שומר נתונים...", "מפיק שטר הלוואה...", "שולח מייל...", "כמעט סיימנו..."];
                    let i = 0;
                    interval = setInterval(() => {
                        i = (i + 1) % texts.length;
                        setLoadingText(texts[i]);
                    }, 1500);
                }
                return () => clearInterval(interval);
            }, [submitting]);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData({ ...formData, [name]: value });
                if (errors[name]) setErrors({ ...errors, [name]: '' });
                if (name === 'bankName' || name === 'bankAccount') setForceBankSubmit(false);
                if (name === 'bankName' && formData.bankAccount) {
                    const bankErr = validateSpecificBank(value, formData.bankAccount);
                    setErrors(prev => ({ ...prev, bankAccount: bankErr }));
                }
            };

            const handleBlur = (e) => {
                const { name, value } = e.target;
                let errorMsg = '';
                if (name === 'idNumber' && value && !isValidIsraeliID(value)) errorMsg = 'מספר זהות אינו תקין';
                else if (name === 'phone' && value && !isValidMobile(value)) errorMsg = 'מספר נייד לא תקין';
                else if (name === 'bankAccount' && value) {
                    if (formData.bankName) errorMsg = validateSpecificBank(formData.bankName, value);
                    else if (!/^\d{6,13}$/.test(value)) errorMsg = 'מספר חשבון לא תקין';
                }
                setErrors(prev => ({ ...prev, [name]: errorMsg }));
            };

            const handleSubmitForm = async (e) => {
                e.preventDefault();
                
                const idErr = (!isValidIsraeliID(formData.idNumber)) ? 'מספר זהות אינו תקין' : '';
                const phoneErr = (!isValidMobile(formData.phone)) ? 'מספר נייד לא תקין' : '';
                const bankErr = validateSpecificBank(formData.bankName, formData.bankAccount);
                setErrors({ idNumber: idErr, phone: phoneErr, bankAccount: bankErr });

                if (idErr || phoneErr) return;
                if (bankErr && !forceBankSubmit) return;

                setSubmitting(true);
                setLoadingText("מתחבר לשרת...");

                const fullAddress = `${formData.street} ${formData.houseNum}, ${formData.city}`;
                const dataToSend = { ...formData, address: fullAddress };
                
                if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "PASTE_YOUR_URL_HERE") {
                    try {
                        // שיטה: "שגר ושכח" (no-cors)
                        // אנחנו לא מחכים לתשובה אלא מניחים הצלחה אחרי 2.5 שניות
                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: "POST",
                            mode: "no-cors",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(dataToSend)
                        });
                        
                        setTimeout(() => {
                            setSubmitting(false);
                            setStep(2);
                        }, 2500);

                    } catch (error) {
                        // בשיטה הזו גם שגיאות נתפסות וממשיכים הלאה
                        console.error("Error", error);
                        setStep(2); 
                        setSubmitting(false);
                    }
                } else {
                    alert("שגיאת תצורה: חסר קישור לשרת");
                    setSubmitting(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col items-center py-6 px-4">
                    {submitting && <ProcessingOverlay text={loadingText} />}
                    
                    <div className="text-center mb-6 w-full max-w-5xl">
                        <h1 className="text-3xl font-serif-title font-bold text-slate-800 tracking-tight">קרן אסתר</h1>
                        <p className="text-slate-500 font-medium text-sm">ע.ר. 580021475</p>
                    </div>

                    <div className="w-full max-w-6xl bg-white rounded shadow-2xl overflow-hidden border-t-4 border-slate-800 animate-fade-in">
                        <div className="flex w-full bg-slate-50 border-b border-slate-200">
                            <div className={`flex-1 py-3 text-center text-sm font-bold ${step === 1 ? 'text-slate-800 bg-white border-l border-slate-200' : 'text-slate-400'}`}>1. מילוי פרטים</div>
                            <div className={`flex-1 py-3 text-center text-sm font-bold ${step === 2 ? 'text-slate-800 bg-white' : 'text-slate-400'}`}>2. סיום</div>
                        </div>

                        <div className="p-8">
                            {step === 1 && (
                                <form onSubmit={handleSubmitForm}>
                                    <div className="flex items-center justify-between mb-6">
                                        <h2 className="text-xl font-bold text-slate-800 border-r-4 border-slate-800 pr-3">טופס בקשת הלוואה</h2>
                                        {formData.amount && (
                                            <div className="bg-slate-100 text-slate-700 px-4 py-1 rounded text-sm font-bold">
                                                סה"כ ערבים נדרשים: {guarantorsCount}
                                            </div>
                                        )}
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="bg-slate-50 p-4 rounded border border-slate-100">
                                            <h3 className="text-xs font-bold text-slate-400 uppercase mb-4">פרטי אישיים</h3>
                                            <div className="grid grid-cols-2 gap-3">
                                                <InputField label="שם פרטי" name="firstName" value={formData.firstName} onChange={handleChange} placeholder="ישראל" type="text" className="col-span-1" />
                                                <InputField label="שם משפחה" name="lastName" value={formData.lastName} onChange={handleChange} placeholder="ישראלי" type="text" className="col-span-1" />
                                            </div>
                                            <InputField label="מספר זהות" name="idNumber" value={formData.idNumber} onChange={handleChange} onBlur={handleBlur} error={errors.idNumber} placeholder="000000000" type="text" />
                                            
                                            {/* פיצול שדות הכתובת */}
                                            <div className="grid grid-cols-4 gap-2">
                                                <div className="col-span-2">
                                                    <InputField label="רחוב" name="street" value={formData.street} onChange={handleChange} placeholder="הזית" type="text" />
                                                </div>
                                                <div className="col-span-1">
                                                    <InputField label="מס'" name="houseNum" value={formData.houseNum} onChange={handleChange} placeholder="10" type="text" />
                                                </div>
                                                <div className="col-span-1">
                                                    <InputField label="עיר" name="city" value={formData.city} onChange={handleChange} placeholder="חיפה" type="text" />
                                                </div>
                                            </div>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded border border-slate-100">
                                            <h3 className="text-xs font-bold text-slate-400 uppercase mb-4">פרטי הלוואה ויצירת קשר</h3>
                                            <div className="grid grid-cols-2 gap-3">
                                                <InputField label="סכום הלוואה (ש&quot;ח)" name="amount" value={formData.amount} onChange={handleChange} placeholder="5000" type="number" />
                                                <InputField label="סכום במילים" name="amountWords" value={formData.amountWords} onChange={handleChange} placeholder="חמשת אלפים..." type="text" />
                                            </div>
                                            <InputField label="טלפון נייד" name="phone" value={formData.phone} onChange={handleChange} onBlur={handleBlur} error={errors.phone} placeholder="0500000000" type="tel" />
                                            <InputField label="טלפון נוסף (לא חובה)" name="additionalPhone" value={formData.additionalPhone} onChange={handleChange} placeholder="נייח או נייד נוסף" type="tel" required={false} />
                                            <InputField label="דואר אלקטרוני" name="email" value={formData.email} onChange={handleChange} placeholder="mail@example.com" type="email" />
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded border border-slate-100">
                                            <h3 className="text-xs font-bold text-slate-400 uppercase mb-4">פרטי חשבון להפקדה</h3>
                                            <SelectField label="בנק" name="bankName" value={formData.bankName} onChange={handleChange} options={ISRAELI_BANKS} />
                                            <div className="grid grid-cols-2 gap-3">
                                                <InputField label="סניף" name="bankBranch" value={formData.bankBranch} onChange={handleChange} placeholder="000" type="text" />
                                                <InputField label="מס' חשבון" name="bankAccount" value={formData.bankAccount} onChange={handleChange} onBlur={handleBlur} error={errors.bankAccount} placeholder="000000" type="text">
                                                    {errors.bankAccount && (
                                                        <div className="mt-2 flex items-start">
                                                            <input type="checkbox" id="forceBank" checked={forceBankSubmit} onChange={(e) => setForceBankSubmit(e.target.checked)} className="mt-1 ml-2" />
                                                            <label htmlFor="forceBank" className="text-xs text-gray-700 cursor-pointer">מספר החשבון תקין, אשר בכל זאת</label>
                                                        </div>
                                                    )}
                                                </InputField>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="mt-8 flex justify-end">
                                        <button type="submit" disabled={submitting} className={`bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-12 rounded shadow transition-all flex items-center gap-2 ${submitting ? 'opacity-70 cursor-wait' : ''}`}>
                                            שלח בקשה 
                                            {!submitting && <span>&larr;</span>}
                                        </button>
                                    </div>
                                </form>
                            )}

                            {step === 2 && (
                                <div className="max-w-2xl mx-auto text-center py-6 animate-fade-in">
                                    <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                        <svg className="text-green-600 w-10 h-10" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>
                                    </div>
                                    <h2 className="text-3xl font-bold text-slate-800 mb-4">הבקשה נקלטה בהצלחה!</h2>
                                    <p className="text-lg text-slate-600 mb-8">
                                        שטר ההלוואה נשלח למייל: <span className="font-bold">{formData.email}</span>.
                                    </p>
                                    
                                    <div className="bg-slate-50 border p-4 text-center rounded max-w-md mx-auto">
                                        <p className="text-sm text-slate-700">
                                            יש להדפיס את השטר, למלא את הפרטים החסרים (תשלומים ותאריכים), לחתום ולהחתים את הערבים, ולהעביר את המקור למשרדי הגמ"ח.
                                        </p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    <div className="mt-6 text-slate-400 text-xs">נבנה ע"י KobiPhoto עבור קרן אסתר חיפה</div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
